<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Pawgoods — pet accessories that survive the house</title>
<meta name="description" content="A short list of pet accessories, picked for the part that matters: whether it is still working after a year with a dog in the house.">
<meta property="og:title" content="Pawgoods — pet accessories that survive the house">
<meta property="og:description" content="A short list of pet accessories, picked for the part that matters: whether it is still working after a year with a dog in the house.">
<meta property="og:type" content="website">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#3c50e0">
<link rel="icon" href="brand/favicon.ico" sizes="48x48">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip" href="#main">Skip to main content</a>

<!-- All copy below is written by config.js. The markup is scaffolding only;
     edit config.js, not this file. Icons are keyed from config and rendered
     here so there is no icon-font dependency. -->

<svg class="icon-defs" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-truck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
    </symbol>
    <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6l-8-4z"/><path d="m9 12 2 2 4-4"/>
    </symbol>
    <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-4.6A8 8 0 0 1 11 4h2a8 8 0 0 1 8 8z"/>
    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l1 14H4L5 7z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></symbol>
    <symbol id="i-search-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-arrow-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
  </defs>
</svg>

<div class="announce" hidden><p></p></div>

<header class="site-head">
  <!-- Row 1: logo, category pill, search, account, cart -->
  <div class="wrap head-row head-row-top">
    <a class="logo" href="index.html">
      <span class="logo-mark"><svg viewBox="0 0 256 256" focusable="false" aria-hidden="true">
        <g fill="currentColor">
          <rect x="108" y="40" width="40" height="64" rx="20"/>
          <rect x="44" y="66" width="40" height="52" rx="20"/>
          <rect x="172" y="66" width="40" height="52" rx="20"/>
          <path d="M66 150 C66 136 82 126 100 126 H156 C174 126 190 136 190 150 C190 190 162 226 128 226 C94 226 66 190 66 150 Z"/>
        </g>
      </svg><span class="mascot" data-directions="mascots/pug-directions.webp" data-reactions="mascots/pug-reactions.webp" aria-label="Boop the pug"></span></span>
      <span class="logo-text">Store</span>
    </a>

    <nav class="main-nav" aria-label="Main"><ul></ul></nav>

    <button type="button" class="search-ico" id="search-toggle" aria-label="Search products" aria-expanded="false">
      <svg class="i-search" aria-hidden="true"><use href="#i-search"/></svg>
    </button>

    <a class="cart-link" href="cart.html" aria-label="Cart">
      <svg class="i-bag" aria-hidden="true"><use href="#i-bag"/></svg>
      <span class="cart-count" data-cart-count hidden>0</span>
    </a>
  </div>

  <!-- Expandable search row, opened by the header icon -->
  <div class="search-drawer" id="search-drawer" hidden>
    <div class="wrap">
      <form class="search" role="search" onsubmit="return false">
        <label>
          <span class="visually-hidden">Search products</span>
          <input type="search" id="q" placeholder="Search products..." autocomplete="off">
        </label>
      </form>
    </div>
  </div>

  <!-- Row 2: secondary nav -->
  <div class="head-sub" hidden>
    <div class="wrap head-row head-row-sub">
      <nav class="sub-nav" aria-label="Sections"><ul></ul></nav>
      <span class="sale-pill">SALE</span>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">

  <!-- Promo hero: 100vh full-bleed cover like the demo (theirs: hero-01.jpg) -->
  <section class="promo" aria-labelledby="hero-h">
    <img class="promo-photo" alt="" decoding="async" fetchpriority="high"
      width="1920" height="1080"
      src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=1920&h=1080&fit=crop&q=70&fm=jpg">
    <div class="wrap promo-copy">
      <p class="promo-kicker" id="promo-kicker"></p>
      <h1 id="hero-h"></h1>
      <p class="lead"></p>
      <a class="cta" href="#grid"></a>
    </div>
  </section>

  <!-- Product grid -->
  <section class="band" id="grid" aria-labelledby="grid-h">
    <div class="wrap">
      <div class="band-head">
        <h2 id="grid-h"></h2>
        <button type="button" class="pill-cta" id="view-all" hidden></button>
      </div>
      <div class="filter-row" role="group" hidden></div>
      <p class="filter-status" id="filter-status" role="status"></p>
      <h3 class="visually-hidden" id="filters-h"></h3>
      <div id="grid-list" class="grid" aria-busy="true">
        <p class="loading">Loading products&hellip;</p>
      </div>
      <p class="empty" id="empty" hidden>Nothing matches. <button type="button" class="linkish" id="reset">Clear filters</button></p>
    </div>
  </section>

  <!-- Category tiles: circular photos, as in the reference -->
  <section class="band" id="categories" aria-labelledby="cat-h" hidden>
    <div class="wrap">
      <div class="band-head">
        <h2 id="cat-h"></h2>
        <div class="cat-nav">
          <button type="button" class="round-btn" id="cat-prev" aria-label="Previous categories"><svg aria-hidden="true" style="transform:rotate(180deg)"><use href="#i-arrow-r"/></svg></button>
          <button type="button" class="round-btn" id="cat-next" aria-label="Next categories"><svg aria-hidden="true"><use href="#i-arrow-r"/></svg></button>
        </div>
      </div>
      <ul class="cat-grid" id="cat-grid"></ul>
    </div>
  </section>

  <!-- Spotlight: new-arrival feature, image + copy side by side -->
  <section class="band" id="split" hidden>
    <div class="wrap split-row">
      <a class="split-media" href="#grid">
        <img alt="" loading="lazy" width="1600" height="800">
        <span class="split-label" id="split-label">New Arrival</span>
      </a>
      <div class="split-product" id="split-product"></div>
    </div>
  </section>

  <!-- Testimonials -->
  <section class="band reviews" id="reviews" aria-labelledby="reviews-h" hidden>
    <div class="wrap">
      <div class="band-head center"><div><p class="eyebrow" id="reviews-eyebrow"></p><h2 id="reviews-h"></h2></div></div>
      <ul class="review-list" id="review-list"></ul>
    </div>
  </section>

  <!-- Why choose us: 4-up like the demo -->
  <section class="band why" id="why" aria-labelledby="why-h" hidden>
    <div class="wrap">
      <div class="band-head center"><div><p class="eyebrow" id="why-eyebrow"></p><h2 id="why-h"></h2></div></div>
      <ul class="why-list four-up" id="why-list"></ul>
    </div>
  </section>

</main>

<footer class="site-foot">
  <div class="wrap">
    <div class="foot-grid">
      <div class="foot-brand">
        <p class="foot-mark"></p>
        <p class="foot-note"></p>
      </div>
      <div id="foot-columns"></div>
    </div>
    <div class="foot-base"><p class="mono-note"></p></div>
  </div>
</footer>

<!-- Mobile cart bar. On a phone the header badge is either scrolled away or
     36px tall, so this is the persistent count, running total and route to the
     cart. Hidden entirely while the cart is empty. Stamped with the cart in the
     fragment by paintCount(), like the header badge. -->
<a class="cart-bar" id="cart-bar" href="cart.html" hidden>
  <span class="cart-bar-count"><span data-cart-count>0</span></span>
  <span class="cart-bar-sum" id="cart-bar-sum"></span>
  <span class="cart-bar-cta">View cart</span>
</a>

<template id="card-tpl">
  <article class="card">
    <a class="shot-link" href="#grid">
      <span class="shot-wrap">
        <img class="shot" alt="" loading="lazy" width="700" height="933">
        <span class="badge" hidden></span>
      </span>
    </a>
    <p class="cat-line"></p>
    <h3 class="name"></h3>
    <p class="desc"></p>
    <div class="buy-row">
      <span class="price"></span>
      <button type="button" class="buy"></button>
    </div>
  </article>
</template>

<template id="cat-tpl">
  <li>
    <a class="cat-tile" href="#grid">
      <span class="cat-media"><img alt="" loading="lazy" width="160" height="160"></span>
      <span class="cat-name"></span>
    </a>
  </li>
</template>

<template id="side-tpl">
  <a class="side-card" href="#grid">
    <img alt="" loading="lazy" width="320" height="220">
    <div class="side-copy">
      <span class="side-heading"></span>
      <span class="side-note"></span>
    </div>
  </a>
</template>

<template id="trust-tpl">
  <li class="trust-item">
    <span class="trust-ico"><svg aria-hidden="true"><use href=""></use></svg></span>
    <span class="trust-txt"><strong class="trust-label"></strong><span class="trust-note"></span></span>
  </li>
</template>

<script src="config.js"></script>
<script src="products.js"></script>
<script src="cart.js"></script>
<script src="mascot.js"></script>
<script>
const cfg = globalThis.PAWGOODS_CONFIG ?? {};
const set = (sel, text) => { const el = document.querySelector(sel); if (el) el.textContent = text; };
const show = (sel, on) => { const el = document.querySelector(sel); if (el) el.hidden = !on; };
const setEyebrow = (sel, text) => {
  const el = document.querySelector(sel);
  if (!el || !text) return;
  let brow = el.previousElementSibling;
  if (!brow || !brow.classList.contains('eyebrow')) {
    brow = document.createElement('p');
    brow.className = 'eyebrow';
    el.before(brow);
  }
  brow.textContent = text;
};
const icon = (name) => {
  // Only allow keys we actually ship, so a typo in config cannot inject markup.
  const known = ['truck', 'refresh', 'shield', 'chat'];
  return known.includes(name) ? `#i-${name}` : '#i-chat';
};

/* ---------------------------------------------------------------- content */

try {
  if (cfg.title) document.title = cfg.title;
  if (cfg.description) {
    document.querySelector('meta[name="description"]').content = cfg.description;
    document.querySelector('meta[property="og:title"]').content = cfg.title ?? '';
    document.querySelector('meta[property="og:description"]').content = cfg.description;
  }

  set('.announce p', cfg.announce);
  show('.announce', !!cfg.announce);

  const logoText = document.querySelector('.logo-text');
  const logo = document.querySelector('.logo');
  if (cfg.brand) {
    logoText.textContent = cfg.brand;
    logo.setAttribute('aria-label', `${cfg.brand} home`);
  }

  // Top-row nav. A `pill` item gets the rounded dropdown treatment.
  const navList = document.querySelector('.main-nav ul');
  for (const item of cfg.nav ?? []) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = item.href;
    a.textContent = item.label;
    if (item.pill) {
      a.className = 'nav-pill';
      a.insertAdjacentHTML('afterbegin', '<svg class="i-menu" aria-hidden="true"><use href="#i-menu"/></svg>');
      a.insertAdjacentHTML('beforeend', '<svg class="i-chevron" aria-hidden="true"><use href="#i-chevron"/></svg>');
    }
    li.append(a);
    navList.append(li);
  }
  show('.main-nav', (cfg.nav ?? []).length > 0);

  // Second-row nav.
  const subWrap = document.querySelector('.head-sub');
  const subList = document.querySelector('.sub-nav ul');
  for (const item of cfg.subnav ?? []) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = item.href;
    a.textContent = item.label;
    li.append(a);
    subList.append(li);
  }
  subWrap.hidden = (cfg.subnav ?? []).length === 0;

  document.querySelector('.search input').placeholder = cfg.searchPlaceholder ?? 'Search products...';
  document.querySelector('.search .visually-hidden').textContent = cfg.searchLabel ?? 'Search products';

  // Search icon toggles the drawer row, like the demo's expanding search.
  const searchToggle = document.getElementById('search-toggle');
  const searchDrawer = document.getElementById('search-drawer');
  searchToggle.addEventListener('click', () => {
    const open = searchDrawer.hidden;
    searchDrawer.hidden = !open;
    searchToggle.setAttribute('aria-expanded', String(open));
    if (open) document.getElementById('q').focus();
  });

  // Promo hero: kicker + headline + lead + CTA over the photo.
  const h1 = document.getElementById('hero-h');
  h1.append(cfg.hero.headline ?? '');
  if (cfg.hero.emphasis) h1.append(Object.assign(document.createElement('em'), { textContent: cfg.hero.emphasis }));
  set('#promo-kicker', cfg.hero.kicker);
  show('#promo-kicker', !!cfg.hero.kicker);
  set('.promo .lead', cfg.hero.lead);
  const heroCta = document.querySelector('.promo .cta');
  heroCta.textContent = cfg.hero.cta;
  heroCta.href = cfg.hero.ctaHref ?? '#grid';
  show('.promo .cta', !!cfg.hero.cta);

  setEyebrow('#grid-h', cfg.sections.products.eyebrow);
  set('#grid-h', cfg.sections.products.heading);
  set('#view-all', cfg.sections.products.cta);
  show('#view-all', !!cfg.sections.products.cta);
  document.getElementById('view-all').addEventListener('click', () => {
    // "View All" clears any filter, which is what it implies.
    document.querySelector('.filter[data-filter="all"]')?.click();
    document.getElementById('grid').scrollIntoView();
  });

  set('#filters-h', cfg.sections.products.filterLabel);
  document.querySelector('#filters-h').className = 'visually-hidden';
  document.getElementById('filter-status').setAttribute('aria-label', 'Result count');

  const catSection = document.getElementById('categories');
  if (cfg.sections.categories) { setEyebrow('#cat-h', cfg.sections.categories.eyebrow); set('#cat-h', cfg.sections.categories.heading); }

  const sp = cfg.sections.split;
  if (sp) {
    document.getElementById('split').hidden = false;
    set('#split-label', sp.label ?? 'New Arrival');
    document.querySelector('.split-media img').src = sp.image || '';
  }

  // Reviews.
  const revSection = document.getElementById('reviews');
  const revList = document.getElementById('review-list');
  if (cfg.reviews?.items?.length) {
    revList.replaceChildren();
    set('#reviews-eyebrow', cfg.reviews.eyebrow);
    set('#reviews-h', cfg.reviews.heading);
    for (const r of cfg.reviews.items) {
      const li = document.createElement('li');
      li.className = 'review';
      li.innerHTML = '<p class="stars" aria-label="Rated 5 out of 5">★★★★★</p><blockquote></blockquote><p class="reviewer"></p>';
      li.querySelector('blockquote').textContent = r.quote;
      li.querySelector('.reviewer').textContent = r.name;
      revList.append(li);
    }
    revSection.hidden = false;
  }

  const whySection = document.getElementById('why');
  const whyList = document.getElementById('why-list');
  if (cfg.sections.why) {
    whyList.replaceChildren();
    setEyebrow('#why-h', cfg.sections.why.eyebrow);
    set('#why-h', cfg.sections.why.heading);
    (cfg.sections.why.items ?? []).forEach((item) => {
      const li = document.createElement('li');
      const h3 = document.createElement('h3');
      h3.textContent = item.heading;
      const p = document.createElement('p');
      p.textContent = item.body;
      li.append(h3, p);
      whyList.append(li);
    });
    whySection.hidden = false;
  }

  // Promo photo falls back to the first product photo.
  const products = globalThis.PAWGOODS_PRODUCTS ?? [];
  const promoImg = document.querySelector('.promo-photo');
  if (promoImg && !promoImg.getAttribute('src')) promoImg.src = products[0]?.image || '';

  set('.foot-mark', cfg.brand);
  set('.foot-note', cfg.tagline);
  set('.foot-base .mono-note', cfg.footer.note);
  const footCols = document.getElementById('foot-columns');
  footCols.className = 'foot-cols';
  // __COUNT__ keeps copy honest when the catalogue changes, so read the length
  // off the global rather than the block-scoped `products` below.
  const count = (globalThis.PAWGOODS_PRODUCTS ?? []).length;
  for (const col of cfg.footer.columns ?? []) {
    const div = document.createElement('div');
    const h2 = document.createElement('h2');
    h2.className = 'foot-h';
    h2.textContent = col.heading;
    const ul = document.createElement('ul');
    ul.className = 'foot-list';
    for (const item of col.items) {
      const li = document.createElement('li');
      li.textContent = item.replace('__COUNT__', String(count));
      ul.append(li);
    }
    div.append(h2, ul);
    footCols.append(div);
  }

  // Prune nav links once every section has decided whether it exists. Done at
  // the very bottom, after the product pass: the category section is only
  // unhidden when tiles exist, so pruning during config load read `hidden`
  // too early and deleted the link to a section that was about to appear.
  show('.main-nav', navList.children.length > 0);
} catch (err) {
  console.error('config.js failed', err);
}

/* --------------------------------------------------------------- products */

const grid = document.getElementById('grid-list');
const tpl = document.getElementById('card-tpl');
const catSection = document.getElementById('categories');
const catGrid = document.getElementById('cat-grid');
const catTpl = document.getElementById('cat-tpl');
const filterRow = document.querySelector('.filter-row');
const filterStatus = document.getElementById('filter-status');
const emptyMsg = document.getElementById('empty');

const usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

try {
  const products = globalThis.PAWGOODS_PRODUCTS;
  if (!Array.isArray(products) || !products.length) throw new Error('products.js did not load');

  const counts = new Map();
  for (const p of products) counts.set(p.category, (counts.get(p.category) ?? 0) + 1);

  let activeCategory = 'all';
  let query = '';

  // Drop the loading placeholder. Without this the grid keeps it as a stray
  // child forever, since it is not a .card and apply() never hides it.
  grid.replaceChildren();

  const cards = products.map((p, i) => {
    const node = tpl.content.cloneNode(true);
    const root = node.querySelector('.card');
    root._product = p;
    root.dataset.search = `${p.name} ${p.category} ${p.description}`.toLowerCase();

    const shot = root.querySelector('.shot');
    shot.src = p.image;
    // The name is the heading directly below, so a repeating alt just made
    // screen readers say it twice.
    shot.alt = '';
    if (i < 8) shot.loading = 'eager';

    const line = root.querySelector('.cat-line');
    if (line) line.textContent = p.category;
    root.querySelector('.name').textContent = p.name;
    root.querySelector('.desc').textContent = p.description;
    // Demo sale mode: every card shows the circular Sale badge + struck price.
    // compareAt is display-only; the cart still charges p.price.
    const priceEl = root.querySelector('.price');
    if (cfg.demoSale && p.compareAt && p.compareAt > p.price) {
      const badge = root.querySelector('.badge');
      badge.hidden = false;
      badge.textContent = 'Sale!';
      priceEl.innerHTML = '';
      const del = document.createElement('del');
      del.textContent = usd.format(p.compareAt);
      del.setAttribute('aria-hidden', 'true');
      priceEl.append(del, document.createTextNode(' ' + usd.format(p.price)));
    } else {
      priceEl.textContent = usd.format(p.price);
    }

    // Always a real <button>: the cart works without Stripe connected, so the
    // control stays live and only checkout is gated.
    const buy = root.querySelector('.buy');
    buy.textContent = 'Add to Cart';
    buy.setAttribute('aria-label', `Add ${p.name} to cart`);

    grid.append(node);
    return root;
  });

  // Filter links. Counts come from the data, so a new product in products.js
  // needs no edit here.
  const link = (label, value, n) => {
    const a = document.createElement('button');
    a.type = 'button';
    a.className = 'filter';
    a.dataset.filter = value;
    a.setAttribute('aria-pressed', String(value === 'all'));
    a.innerHTML = `<span>${label}</span><span class="filter-n">${String(n).padStart(2, '0')}</span>`;
    return a;
  };
  filterRow.append(link('All', 'all', products.length));
  for (const [name, n] of counts) filterRow.append(link(name, name, n));
  filterRow.hidden = false;

  function apply() {
    let shown = 0;
    for (const card of cards) {
      const p = card._product;
      const ok =
        (activeCategory === 'all' || p.category === activeCategory) &&
        (!query || card.dataset.search.includes(query));
      card.hidden = !ok;
      if (ok) shown++;
    }
    for (const f of filterRow.children) {
      f.setAttribute('aria-pressed', String(f.dataset.filter === activeCategory));
    }
    filterStatus.textContent = shown === products.length
      ? `${products.length} products`
      : `${shown} of ${products.length}`;
    emptyMsg.hidden = shown > 0;
  }

  filterRow.addEventListener('click', (e) => {
    const f = e.target.closest('.filter');
    if (!f) return;
    activeCategory = f.dataset.filter;
    apply();
  });

  document.getElementById('reset').addEventListener('click', () => {
    activeCategory = 'all';
    query = '';
    document.getElementById('q').value = '';
    apply();
  });

  document.getElementById('q').addEventListener('input', (e) => {
    query = e.target.value.trim().toLowerCase();
    apply();
  });

  // Category tiles. First photo in each category becomes the tile image.
  const firstOf = new Map();
  for (const p of products) if (!firstOf.has(p.category)) firstOf.set(p.category, p);
  for (const [name, p] of firstOf) {
    const li = catTpl.content.cloneNode(true);
    const tile = li.querySelector('.cat-tile');
    tile.dataset.filter = name;
    li.querySelector('img').src = p.image;
    li.querySelector('img').alt = '';
    li.querySelector('.cat-name').textContent = name;
    catGrid.append(li);
  }
  if (firstOf.size) catSection.hidden = false;

  catGrid.addEventListener('click', (e) => {
    const tile = e.target.closest('.cat-tile');
    if (!tile) return;
    activeCategory = tile.dataset.filter;
    query = '';
    document.getElementById('q').value = '';
    apply();
    document.getElementById('grid').scrollIntoView();
  });

  // Category carousel arrows: the row scrolls horizontally on narrow screens.
  const catScroller = catGrid;
  const step = () => Math.max(160, catScroller.clientWidth * 0.8);
  document.getElementById('cat-prev').addEventListener('click', () => catScroller.scrollBy({ left: -step(), behavior: 'smooth' }));
  document.getElementById('cat-next').addEventListener('click', () => catScroller.scrollBy({ left: step(), behavior: 'smooth' }));

  apply();
  grid.removeAttribute('aria-busy');

  // Split section third column: any product to complete the row.
  const splitProduct = document.getElementById('split-product');
  const splitFirst = products[0];
  if (splitProduct && splitFirst) {
    const node = tpl.content.cloneNode(true);
    const root = node.querySelector('.card');
    root._product = splitFirst;
    root.querySelector('.shot').src = splitFirst.image;
    root.querySelector('.cat-line').textContent = splitFirst.category;
    root.querySelector('.name').textContent = splitFirst.name;
    root.querySelector('.desc').textContent = splitFirst.description;
    root.querySelector('.price').textContent = usd.format(splitFirst.price);
    const buy = root.querySelector('.buy');
    buy.textContent = 'Add to Cart';
    buy.setAttribute('aria-label', `Add ${splitFirst.name} to cart`);
    splitProduct.append(node);
  }
} catch (err) {
  grid.removeAttribute('aria-busy');
  grid.textContent = 'Could not load products.js. Make sure it sits next to index.html. (' + err.message + ')';
  console.error(err);
}

/* ------------------------------------------------------------------ cart */

const countEls = document.querySelectorAll('[data-cart-count]');

// Coming back from the cart: on file:// the two pages may not share storage, so
// the cart arrives in the URL fragment. Read it before painting the badge.
globalThis.PawCart?.receive();

let lastCount = 0;

const cartBar = document.getElementById('cart-bar');
const cartBarSum = document.getElementById('cart-bar-sum');
const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

function paintCount() {
  const n = globalThis.PawCart?.count() ?? 0;
  for (const el of countEls) {
    el.textContent = String(n);
    el.hidden = n === 0;
    // Grow from centre on the frame the count changes, so the badge reads as a
    // response to the add rather than a static number that appeared.
    if (n !== lastCount && n > 0) {
      el.classList.add('is-bumped');
      setTimeout(() => el.classList.remove('is-bumped'), 180);
    }
  }
  lastCount = n;

  cartBar.hidden = n === 0;
  document.body.classList.toggle('has-cart-bar', n > 0);
  cartBarSum.textContent = n > 0 ? money.format(globalThis.PawCart.subtotal()) : '';

  // Carry the cart in the link's fragment, because on file:// the two pages may
  // not share storage (Firefox partitions it per file).
  for (const el of document.querySelectorAll('.cart-link, .cart-bar')) globalThis.PawCart.stampLink(el);
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.buy');
  if (!btn) return;
  const card = btn.closest('.card');
  if (!card || !card._product) return;
  globalThis.PawCart.add(card._product.id);
  // Guarded per button: clicking add twice quickly would otherwise let the
  // first timer revert a label the second click had already replaced.
  clearTimeout(btn._addedTimer);
  btn.textContent = 'Added';
  btn.classList.add('is-added');
  btn._addedTimer = setTimeout(() => {
    btn.textContent = 'Add to Cart';
    btn.classList.remove('is-added');
  }, 1400);
});

window.addEventListener('pawcart:change', paintCount);
paintCount();

/* Transparent-over-hero header: solid once scrolled past the promo.
   Mirrors the demo's ast-theme-transparent-header behaviour. */
(function () {
  const head = document.querySelector('.site-head');
  const promo = document.querySelector('.promo');
  if (!head || !promo) return;
  const onScroll = () => {
    head.classList.toggle('is-solid', window.scrollY > promo.offsetHeight - 80);
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();

/* -------------------------------------------------------------- nav prune */

// A nav link pointing at a section this page does not have is a dead control,
// so drop it. Runs after both render passes: a section's `hidden` flag is not
// final until the product data has decided whether it has anything to show.
for (const a of document.querySelectorAll('.main-nav a, .sub-nav a')) {
  const id = a.getAttribute('href')?.slice(1);
  const target = id && document.getElementById(id);
  if (id && (!target || target.hidden)) a.closest('li').remove();
}
show('.main-nav', document.querySelector('.main-nav ul').children.length > 0);
if (!document.querySelector('.sub-nav ul').children.length) document.querySelector('.head-sub').hidden = true;
</script>
